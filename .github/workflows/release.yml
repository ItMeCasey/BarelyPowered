name: release

# Push a tag such as v2026.11.1 to build every layer, combine them into one jar per Minecraft version, publish a GitHub
# prerelease and upload to CurseForge. The tag must equal the mod_version of every module, or the run fails.
# A manual run only builds and attaches the jars to the run, unless "publish" is ticked.
# Needs the repository secret CURSEFORGE_TOKEN (a CurseForge upload API token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release type
        type: choice
        options: [beta, alpha, release]
        default: beta
      publish:
        description: Upload to CurseForge (off builds and attaches the jars to the run only)
        type: boolean
        default: false
      dry_run:
        description: Check the CurseForge game version ids and print the upload plan, uploading nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        project: [barelypowered, barelycables]
        layer: [neoforge-1.21.1, forge-1.21.1, neoforge-26.1.2, forge-26.1.2, neoforge-26.2, forge-26.2, neoforge-26.3, forge-26.3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.project == 'barelycables' && format('barelycables/{0}', matrix.layer) || matrix.layer }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ endsWith(matrix.layer, '1.21.1') && 21 || 25 }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.project }}-${{ matrix.layer }}
          path: |
            ${{ matrix.project == 'barelycables' && format('barelycables/{0}', matrix.layer) || matrix.layer }}/build/libs/*.jar
            !${{ matrix.project == 'barelycables' && format('barelycables/{0}', matrix.layer) || matrix.layer }}/build/libs/*-sources.jar
            !${{ matrix.project == 'barelycables' && format('barelycables/{0}', matrix.layer) || matrix.layer }}/build/libs/*-dev.jar
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: layers

      - name: Check the version
        id: version
        # A tag publishes only the builds whose mod_version equals the tag; a layer left at an older version is skipped
        # (and named in the log) instead of going out under a newer number. A manual run uses the NeoForge 1.21.1 version.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -h '^mod_version=' neoforge-1.21.1/gradle.properties | sed 's/^mod_version=//')
          fi
          matching=0
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            f=$(grep -h '^mod_version=' forge-$mc/gradle.properties | sed 's/^mod_version=//')
            n=$(grep -h '^mod_version=' neoforge-$mc/gradle.properties | sed 's/^mod_version=//')
            if [ "$f" = "$version" ] && [ "$n" = "$version" ]; then matching=$((matching+1)); else echo "Minecraft $mc is at forge=$f neoforge=$n, not $version: it will not be published"; fi
          done
          if [ "$matching" -eq 0 ]; then echo "No Minecraft version has both layers at $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Combine the loader jars of each Minecraft version and nest BarelyCables
        run: |
          mkdir -p dist cables
          cabver=$(grep -h '^mod_version=' barelycables/neoforge-1.21.1/gradle.properties | cut -d= -f2)
          version="${{ steps.version.outputs.version }}"
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            python3 scripts/combine_jars.py "cables/barelycables-mc$mc-$cabver.jar" layers/barelycables-*-$mc/*.jar
            jars=$(ls layers/barelypowered-*-$mc/*-$version.jar 2>/dev/null || true)
            if [ "$(echo "$jars" | wc -w)" -eq 2 ]; then
              python3 scripts/combine_jars.py "dist/barelypowered-mc$mc-$version.jar" $jars
              python3 scripts/nest_cables.py "dist/barelypowered-mc$mc-$version.jar" "cables/barelycables-mc$mc-$cabver.jar" --range "[$cabver,)"
            else
              echo "skipping Minecraft $mc: no pair of loader jars at version $version"
            fi
          done
          ls -la dist cables
          for jar in dist/*.jar cables/*.jar; do
            if unzip -l "$jar" | grep -E "/dev/|SelfTest|ShotTour|test_energy"; then echo "dev files in $jar"; exit 1; fi
          done

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          {
            echo "One jar per Minecraft version (1.21.1, 26.1.2, 26.2, 26.3); each works on Forge and NeoForge. Generators and batteries output Forge Energy, so any cable mod carries it; the BarelyCables energy cables are nested inside."
            echo
            echo "Changes:"
            if [ -n "$previous" ]; then git log --no-merges --pretty='format:- %s' "$previous..${GITHUB_SHA}"; else git log --no-merges -n 20 --pretty='format:- %s'; fi
            echo
          } > notes.md
          cat notes.md

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "BarelyPowered ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --prerelease

      - name: CurseForge dry run (reads the live game version list, uploads nothing)
        if: inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}" \
            --dry-run

      - name: Upload to CurseForge
        if: (github.ref_type == 'tag' || inputs.publish) && !inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}"

      - name: Keep the jars with the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-jars
          path: dist/*.jar
