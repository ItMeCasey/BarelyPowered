name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    # Picks the modules whose code changed in this push or pull request, so unchanged builds are never run.
    # Docs, status, branding and workflow-only changes pick nothing. See .github/scripts/plan_matrix.py.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      test_any: ${{ steps.plan.outputs.test_any }}
      combine: ${{ steps.plan.outputs.combine }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: python3 .github/scripts/plan_matrix.py build --before "${{ github.event.pull_request.base.sha || github.event.before }}" --sha "${{ github.sha }}"

  versions:
    # Releases are tagged v<mod_version> and publish the Minecraft versions whose Forge and NeoForge BarelyPowered modules
    # carry that number, so the two loaders of one Minecraft version must agree; the same goes for BarelyCables. The
    # BarelyPowered and BarelyCables numbers are independent, and so are different Minecraft versions, because only the
    # modules that changed are bumped.
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Both BarelyPowered loaders of each Minecraft version agree on mod_version
        run: |
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            versions=$(grep -h '^mod_version=' *-$mc/gradle.properties | sort -u)
            echo "$mc: $versions"
            test "$(echo "$versions" | wc -l)" -eq 1
          done
      - name: Both BarelyCables loaders of each Minecraft version agree on mod_version
        run: |
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            versions=$(grep -h '^mod_version=' barelycables/*-$mc/gradle.properties | sort -u)
            echo "$mc: $versions"
            test "$(echo "$versions" | wc -l)" -eq 1
          done

  test:
    # Unit tests for the shared logic that does not need a running game.
    needs: [plan, versions]
    if: needs.plan.outputs.test_any == 'true'
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.test_matrix) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon

  build:
    needs: [plan, versions]
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.project }}-${{ matrix.layer }}
          path: |
            ${{ matrix.dir }}/build/libs/*.jar
            !${{ matrix.dir }}/build/libs/*-sources.jar
            !${{ matrix.dir }}/build/libs/*-dev.jar

  combine:
    # One combined jar per Minecraft version, holding both loaders; BarelyCables is nested inside it with jar-in-jar. Only
    # for Minecraft versions whose four layers (BarelyPowered and BarelyCables, both loaders) were all built in this run.
    needs: [plan, build]
    if: needs.plan.outputs.combine != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: layers
      - name: Combine the loader jars of each Minecraft version and nest BarelyCables
        run: |
          mkdir -p dist cables
          cabver=$(grep -h '^mod_version=' barelycables/neoforge-1.21.1/gradle.properties | cut -d= -f2)
          for mc in ${{ needs.plan.outputs.combine }}; do
            python3 scripts/combine_jars.py "cables/barelycables-mc$mc-$cabver.jar" layers/barelycables-*-$mc/*.jar
            version=$(grep -h '^mod_version=' forge-$mc/gradle.properties | cut -d= -f2)
            python3 scripts/combine_jars.py "dist/barelypowered-mc$mc-$version.jar" layers/barelypowered-*-$mc/*.jar
            python3 scripts/nest_cables.py "dist/barelypowered-mc$mc-$version.jar" "cables/barelycables-mc$mc-$cabver.jar" --range "[$cabver,)"
          done
          ls -la dist cables
      - name: The release jars hold no development tools
        run: |
          for jar in dist/*.jar cables/*.jar; do
            if unzip -l "$jar" | grep -E "/dev/|SelfTest|ShotTour|test_energy"; then echo "dev files in $jar"; exit 1; fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: combined-jars
          path: |
            dist/*.jar
            cables/*.jar
