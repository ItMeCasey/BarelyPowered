name: Bug report
description: Something in BarelyPowered doesn't work the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If the game crashed, use **Crash report** instead.
        If a generator makes the wrong amount of power, use **Wrong output**.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see.
      placeholder: My wind turbine shows no output even though nothing is above it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Place a wind turbine on a hill
        2. Right-click it with an empty hand
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BarelyPowered version
      description: From the jar's file name or the mod list.
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and loader versions
      placeholder: Minecraft 1.21.1, NeoForge ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where is BarelyPowered installed?
      options:
        - Single player
        - Dedicated server
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The mods in your instance, or a link to your modpack. Leave empty if it happens with BarelyPowered alone.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag images or a short clip in here.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        `logs/latest.log` from your Minecraft folder. For a long log, upload it to https://mclo.gs or a GitHub gist and paste the link.
      render: text
