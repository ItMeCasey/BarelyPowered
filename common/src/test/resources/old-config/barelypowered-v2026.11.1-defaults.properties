# BarelyPowered settings. Energy is in Forge Energy (FE); rates are per game tick (20 per second).
# Edit a value and restart the game or server. Delete a line to restore its default.

# Each generator stores this many ticks of its top output before it stops producing.
general.buffer_ticks=100

# Push energy into adjacent blocks that accept Forge Energy. Cables can also pull from the generator.
general.push_to_neighbors=true

# How fast a generator can hand energy out, as a multiple of its top output.
general.transfer_multiplier=2.0

# Energy added by one right-click.
hand_crank.fe_per_use=200

# Ticks between cranks.
hand_crank.cooldown_ticks=6

# Most energy the crank hands out per tick.
hand_crank.max_output=40

# Energy the crank can hold.
hand_crank.buffer=1000

# Stone-tier output while coal burns.
combustion.coal.fe_per_tick=30

# Ticks one coal burns in a stone-tier generator.
combustion.coal.burn_ticks=1600

# Stone-tier output while charcoal burns.
combustion.charcoal.fe_per_tick=24

# Ticks one charcoal burns in a stone-tier generator.
combustion.charcoal.burn_ticks=1600

# Stone-tier output while logs or planks burn.
combustion.wood.fe_per_tick=12

# Ticks one log or plank burns in a stone-tier generator.
combustion.wood.burn_ticks=300

# Output multiplier for stone, iron and steel generators.
combustion.tier.output_multiplier=1.0,2.0,4.0

# Burn time multiplier for stone, iron and steel generators (lower burns faster).
combustion.tier.burn_multiplier=1.0,0.75,0.6

# Stone-tier output while lava burns.
lava.fe_per_tick=80

# Ticks one bucket (1000 mB) of lava lasts in a stone-tier generator.
lava.bucket_ticks=1200

# How many buckets of lava the generator holds.
lava.tank_buckets=4

# Output multiplier for stone, iron and steel lava generators.
lava.tier.output_multiplier=1.0,2.0,4.0

# Burn time multiplier for stone, iron and steel lava generators.
lava.tier.burn_multiplier=1.0,0.8,0.6

# Tier 1 output at noon with a clear sky.
solar.tier1.peak=6.0

# Tier 2 output at noon with a clear sky.
solar.tier2.peak=24.0

# Tier 1 output at night (needs sky access).
solar.tier1.night_floor=0.0

# Tier 2 output at night (needs sky access).
solar.tier2.night_floor=1.5

# Tier 1 share of output left in rain.
solar.tier1.rain_factor=0.25

# Tier 2 share of output left in rain.
solar.tier2.rain_factor=0.6

# Tier 1 share of output left in a thunderstorm.
solar.tier1.thunder_factor=0.1

# Tier 2 share of output left in a thunderstorm.
solar.tier2.thunder_factor=0.4

# Tier 1 output at full height with open sky.
wind.tier1.base=12.0

# Tier 2 output at full height with open sky.
wind.tier2.base=40.0

# At or below this height the wind is at its weakest.
wind.height.min_y=64

# At or above this height the wind is at full strength.
wind.height.full_y=192

# Share of output left at the minimum height.
wind.height.floor=0.15

# Output multiplier in rain.
wind.rain_bonus=1.2

# Output multiplier in a thunderstorm.
wind.thunder_bonus=1.5

# How much of the output solid blocks around the blades can take away (1.0 = all).
wind.blocked_penalty=0.9

# Other turbines within this many blocks steal wind.
wind.turbine_radius=6

# Output lost for each other turbine in range.
wind.turbine_penalty=0.2

# Output never drops below this share because of other turbines.
wind.turbine_min_factor=0.3

# Output for one unit of flow. A falling stream counts as 1.0 and a flowing block counts level/8.
water_wheel.fe_per_flow=28.0

# Flow beyond this adds nothing.
water_wheel.max_flow=2.0

# Flow credited for a still water source block touching the wheel (0 = needs flowing water).
water_wheel.source_flow=0.0

# Output for one unit of heat.
geothermal.fe_per_heat=16.0

# Heat beyond this adds nothing.
geothermal.max_heat=3.0

# Heat from a lava source block touching or near the generator.
geothermal.lava_source_heat=1.0

# Heat from flowing lava.
geothermal.lava_flow_heat=0.5

# Heat from a magma block.
geothermal.magma_heat=0.75

# Energy a basic battery holds.
battery.basic.capacity=100000

# Energy an iron battery holds.
battery.iron.capacity=400000

# Energy a steel battery holds.
battery.steel.capacity=1600000

# Most energy a basic battery takes in, and most it gives out, each tick.
battery.basic.rate=200

# Most energy an iron battery takes in, and most it gives out, each tick.
battery.iron.rate=800

# Most energy a steel battery takes in, and most it gives out, each tick.
battery.steel.rate=3200
