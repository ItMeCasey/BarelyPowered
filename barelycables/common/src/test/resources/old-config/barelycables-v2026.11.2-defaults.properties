# BarelyCables settings. Energy is in Forge Energy (FE); rates are per game tick (20 per second).
# Edit a value and restart the game or server. Delete a line to restore its default.

# Most energy a network of basic cables moves each tick.
cable.basic.rate=400

# Most energy a network of iron cables moves each tick.
cable.iron.rate=1600

# Most energy a network of steel cables moves each tick.
cable.steel.rate=6400

# The network keeps this many ticks of its rate in its own buffer, which other mods' pipes can fill and drain.
cable.buffer_ticks=2
