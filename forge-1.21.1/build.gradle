plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.47,6.2)'
}

base.archivesName = "${mod_id}-forge-mc${minecraft_version}"
version = mod_version
group = mod_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-1.21.1/src/main/java'
        java.srcDir '../common/src/main/java'
        resources.srcDir '../version-1.21.1/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

// Dev runs find the mod in one directory, so keep resources next to the compiled classes.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    reobf = false
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            if (project.hasProperty('devTools')) { property 'barelypowered.dev', 'true' }
            property 'eventbus.api.strictRuntimeChecks', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Fills in mods.toml from gradle.properties, the same way the NeoForge module fills in neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic (food math, comparator ranking); they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// SMWTI (Show Me What This Is) is an optional look-at overlay of ours. Only its API is compiled against, from the jar in
// ../libs (the com.itmecasey.smwti.api classes of SMWTI's own jar); the plugin class is never loaded unless SMWTI is installed.
dependencies {
    compileOnly files('../libs/smwti-api-1.21.1.jar')
}

// Development tools (generator self test, test energy sink, screenshot tour) live in src/dev folders and only build with
// -PdevTools, so a normal build and the release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-1.21.1/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
    sourceSets.main.resources.srcDir '../version-1.21.1/src/dev/resources'
}
